<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
  <title>我们的记忆</title>
  <style>
    :root { color-scheme: dark; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; color: #edf0f6; background: #10131a; }
    * { box-sizing: border-box; } body { margin: 0; }
    header { padding: 22px 24px 14px; position: sticky; top: 0; background: #10131a; z-index: 1; border-bottom: 1px solid #ffffff18; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .between { justify-content: space-between; }
    h1 { font-size: 22px; margin: 0; } h2 { font-size: 16px; margin: 0; }
    .muted { color: #a4adbd; font-size: 12px; line-height: 1.6; } .error { color: #ff9eae; white-space: pre-wrap; }
    button, input, select, textarea { font: inherit; color: inherit; border: 1px solid #ffffff24; border-radius: 8px; background: #1b202c; padding: 8px 12px; }
    button { cursor: pointer; } button:hover { background: #2a3041; } button:disabled { opacity: .45; cursor: default; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #b99aff; outline-offset: 2px; }
    nav { margin-top: 16px; } nav button[aria-selected="true"] { background: #b99aff20; border-color: #b99aff; }
    main { padding: 18px 24px 32px; } .filters { margin-bottom: 18px; } #search { flex: 1; min-width: 180px; } #topic { max-width: 240px; }
    article { margin-bottom: 14px; padding: 18px; border: 1px solid #ffffff18; border-radius: 12px; background: #ffffff05; }
    .text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; font-size: 14px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; } .chip { font-size: 12px; padding: 3px 8px; border-radius: 20px; background: #b99aff15; color: #d8c5ff; }
    .actions { margin-top: 12px; } .actions button { font-size: 12px; } .danger { color: #ffb3bc; }
    details { margin-top: 14px; border-top: 1px solid #ffffff12; padding-top: 10px; } summary { cursor: pointer; }
    textarea { display: block; width: 100%; min-height: 140px; resize: vertical; margin: 12px 0; }
    .source { border-left: 2px solid #b99aff44; padding-left: 12px; margin: 12px 0; }
    .pager { justify-content: center; margin: 18px 0; } label { font-size: 13px; } input[type="checkbox"] { accent-color: #b99aff; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="row between"><h1>我们的记忆</h1><button id="refresh" type="button">刷新</button></div>
    <p id="status" class="muted" aria-live="polite">正在读取…</p>
    <nav class="row" role="tablist" aria-label="查看记忆">
      <button id="memories-tab" type="button" role="tab" aria-controls="memories-panel" aria-selected="true">记忆与主题</button>
      <button id="recent-tab" type="button" role="tab" aria-controls="recent-panel" aria-selected="false" tabindex="-1">近期交流</button>
      <button id="timeline-tab" type="button" role="tab" aria-controls="timeline-panel" aria-selected="false" tabindex="-1">来源时间线</button>
      <button id="questions-tab" type="button" role="tab" aria-controls="questions-panel" aria-selected="false" tabindex="-1">提问记录</button>
    </nav>
  </header>
  <main>
    <p id="error" class="error" role="alert" hidden></p>
    <section id="memories-panel" role="tabpanel" aria-labelledby="memories-tab">
      <div class="row filters">
        <input id="search" type="search" aria-label="搜索记忆" placeholder="搜索名称、内容或别称…" />
        <select id="topic" aria-label="筛选主题"><option value="">全部主题</option></select>
        <label><input id="archived" type="checkbox" /> 包含历史记忆</label>
      </div>
      <p id="memory-info" class="muted"></p><div id="memories"></div>
      <div class="row pager"><button id="prev" type="button">上一页</button><span id="page" class="muted"></span><button id="next" type="button">下一页</button></div>
    </section>
    <section id="recent-panel" role="tabpanel" aria-labelledby="recent-tab" hidden><div id="recent"></div></section>
    <section id="timeline-panel" role="tabpanel" aria-labelledby="timeline-tab" hidden><p class="muted">最近收到的对话与活动线索。观察内容保留原来的来源，不等于用户确认。</p><div id="timeline"></div></section>
    <section id="questions-panel" role="tabpanel" aria-labelledby="questions-tab" hidden><div id="questions"></div></section>
  </main>
  <script src="window.js"></script>
</body>
</html>
