<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌宠历史对话</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif;
        color: #eef0f6;
        background: #10131a;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 360px;
        min-height: 100vh;
        background: radial-gradient(ellipse at top left, #252034 0, #10131a 48%);
      }

      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 22px 26px 18px;
        border-bottom: 1px solid #ffffff14;
        background: #10131aeF;
        backdrop-filter: blur(16px);
      }

      #search-form { display: flex; gap: 8px; padding: 12px 24px 0; }
      #search { flex: 1; min-width: 0; padding: 9px 12px; color: inherit;
        background: #ffffff08; border: 1px solid #ffffff22; border-radius: 9px; font: inherit; }
      #more { margin-top: 18px; width: 100%; }
      button:disabled { opacity: 0.5; cursor: default; }

      h1 { margin: 0; font-size: 19px; font-weight: 650; }
      #count { margin-top: 5px; color: #a6a9b8; font-size: 12px; }

      button {
        border: 1px solid #ffffff22;
        border-radius: 9px;
        padding: 8px 12px;
        color: #f4f1ff;
        background: #ffffff0d;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: #ffffff18; }

      main { padding: 20px 24px 32px; }
      #entries { display: grid; gap: 12px; }

      .entry {
        padding: 15px 16px;
        border: 1px solid #ffffff12;
        border-radius: 13px;
        background: #ffffff08;
        box-shadow: 0 8px 24px #00000012;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 9px;
        color: #aaadbc;
        font-size: 12px;
      }

      .expression {
        padding: 2px 7px;
        border-radius: 999px;
        color: #d9c7ff;
        background: #8c65d529;
      }

      .speech { white-space: pre-wrap; line-height: 1.65; }
      .user-speech { margin-bottom: 8px; color: #b5b8c8; line-height: 1.6; white-space: pre-wrap; }
      .summary {
        margin-top: 10px;
        padding-top: 9px;
        border-top: 1px solid #ffffff10;
        color: #a6a9b8;
        font-size: 12px;
        line-height: 1.55;
      }

      .empty, .error {
        padding: 48px 16px;
        color: #a6a9b8;
        text-align: center;
        line-height: 1.6;
      }
      .error { color: #ff9eae; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>桌宠历史对话</h1>
        <div id="count">正在读取…</div>
      </div>
      <button id="refresh" type="button">刷新</button>
    </header>
    <form id="search-form">
      <input id="search" type="search" maxlength="200" placeholder="搜索对话内容" aria-label="搜索对话内容" />
      <button type="submit">搜索</button>
    </form>
    <main>
      <section id="entries" aria-live="polite"></section>
      <button id="more" type="button" hidden>加载更多</button>
    </main>
    <script>
      const entriesEl = document.getElementById("entries");
      const countEl = document.getElementById("count");
      const moreEl = document.getElementById("more");
      let nextCursor = null;
      let displayed = 0;
      let requestVersion = 0;
      let activeSearch = "";
      let loading = false;

      function addText(parent, tag, className, value) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        node.textContent = value;
        parent.appendChild(node);
        return node;
      }

      function render(entries, reset) {
        if (reset) entriesEl.replaceChildren();
        displayed = (reset ? 0 : displayed) + entries.length;
        countEl.textContent = `已显示 ${displayed} 条${nextCursor ? "，可继续加载" : ""}`;

        if (displayed === 0) {
          addText(entriesEl, "div", "empty", activeSearch ? "没有匹配的对话。" : "还没有历史对话。桌宠产生回复后会显示在这里。");
          return;
        }

        for (const entry of entries) {
          const card = document.createElement("article");
          card.className = "entry";
          const meta = document.createElement("div");
          meta.className = "meta";
          const time = Number(entry.t);
          addText(
            meta,
            "time",
            "",
            Number.isFinite(time) ? new Date(time).toLocaleString("zh-CN") : "时间未知",
          );
          addText(meta, "span", "expression", entry.expression || "neutral");
          card.appendChild(meta);
          if (entry.userSaid) {
            addText(card, "div", "user-speech", `你：${entry.userSaid}`);
          }
          addText(card, "div", "speech", entry.petSaid || "");
          for (const [source, summary] of Object.entries(entry.summaries || {})) {
            if (!summary) continue;
            const label = { screen: "画面", audio: "设备音频" }[source] || source;
            addText(card, "div", "summary", `${label}摘要：${summary}`);
          }
          entriesEl.appendChild(card);
        }
      }

      async function loadHistory(reset = true) {
        if (!reset && (loading || !nextCursor)) return;
        const version = ++requestVersion;
        entriesEl.querySelectorAll(".error").forEach((node) => node.remove());
        if (reset) activeSearch = document.getElementById("search").value.trim();
        loading = true;
        moreEl.disabled = true;
        countEl.textContent = "正在读取…";
        try {
          const result = await window.dialogueHistory.getEntries({
            limit: 100, before: reset ? null : nextCursor, search: activeSearch,
          });
          if (version !== requestVersion) return;
          if (!result || !Array.isArray(result.entries)) throw new Error("历史数据格式无效");
          nextCursor = result.nextCursor;
          render(result.entries, reset);
          moreEl.hidden = !nextCursor;
        } catch (error) {
          if (version !== requestVersion) return;
          if (reset) { entriesEl.replaceChildren(); moreEl.hidden = true; }
          addText(entriesEl, "div", "error", `读取历史对话失败：${error.message || error}`);
          countEl.textContent = "读取失败";
        } finally {
          if (version === requestVersion) { loading = false; moreEl.disabled = false; }
        }
      }

      document.getElementById("refresh").addEventListener("click", () => void loadHistory());
      document.getElementById("search-form").addEventListener("submit", (event) => {
        event.preventDefault(); void loadHistory();
      });
      moreEl.addEventListener("click", () => void loadHistory(false));
      void loadHistory();
    </script>
  </body>
</html>
