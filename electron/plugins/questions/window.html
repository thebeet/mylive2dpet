<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
  <title>桌宠想了解一下</title>
  <style>
    :root { color-scheme: dark; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; background: #15131d; color: #eee8fa; }
    * { box-sizing: border-box; } body { margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; -webkit-app-region: drag; }
    header span { font-size: 12px; color: #c2acd9; } header button { -webkit-app-region: no-drag; }
    h1 { font-size: 17px; line-height: 1.6; margin: 12px 0 6px; overflow-wrap: anywhere; }
    p { font-size: 12px; color: #a99eb5; line-height: 1.6; margin: 0 0 14px; }
    button, input { font: inherit; color: inherit; border: 1px solid #ffffff20; border-radius: 9px; background: #ffffff08; }
    button { cursor: pointer; padding: 8px 12px; font-size: 12px; white-space: nowrap; flex-shrink: 0; } button:hover { background: #ffffff16; }
    button:disabled { opacity: .5; cursor: default; } button:focus-visible, input:focus { outline: 2px solid #bb94ee; }
    #options { display: grid; gap: 8px; } #options button { text-align: left; font-size: 14px; }
    .custom { display: flex; gap: 8px; margin-top: 12px; } input { width: 100%; min-width: 0; padding: 9px; font-size: 13px; }
    footer { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    #error { color: #ffadbc; margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header><span>想多了解你一点</span><button id="close" aria-label="稍后再问" type="button">×</button></header>
  <h1 id="prompt">正在准备问题…</h1>
  <p id="reason"></p>
  <div id="options" role="group" aria-label="选择一个答案"></div>
  <form id="custom" class="custom"><input id="text" maxlength="600" aria-label="补充答案" placeholder="也可以补充一句…" /><button type="submit">告诉你</button></form>
  <footer><button id="unknown" type="button">不清楚</button><button id="skip" type="button">跳过</button><button id="defer" type="button">稍后再问</button></footer>
  <p id="error" role="status" aria-live="polite"></p>
  <script src="window.js"></script>
</body>
</html>
